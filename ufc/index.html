<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cageside</title>
<meta name="description" content="Live UFC fight night companion: the fight on now, round clock, live stats, up next and results.">
<meta name="theme-color" content="#0e1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cageside">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; the fight on now leads, then up next, results, the full card. */
:root{
  --bg:#0e1219; --panel:#161c27; --panel2:#1d2533; --line:#283246; --fg:#eef2f8; --muted:#8d99ad; --dim:#5f6a7e;
  --red:#e5484d; --red-soft:rgba(229,72,77,.18); --blue:#3d8bfd; --blue-soft:rgba(61,139,253,.18);
  --gold:#f2b84b; --live:#ff4d4d; --ok:#3ccf91;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);touch-action:pan-x pan-y}
/* No zooming: double-tap and pinch are both off, so the page always stays fully zoomed out. */
button,a,.chip{touch-action:manipulation}
/* No text selection or long-press menus (taps on the TV delay chip were selecting text); typing boxes still work. */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(14,18,25,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font:800 21px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;display:inline-block;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.fresh{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:6px 0;cursor:pointer}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.fresh.ok .dot{background:var(--ok)}
.fresh.warn .dot{background:var(--gold)}

/* Event header */
.event{padding-block:18px 6px}
/* Menu: tonight's details and the settings, tucked away so On now leads the page. */
.menubtn{display:flex;flex-direction:column;justify-content:center;gap:4px;width:38px;height:36px;margin-right:-8px;padding:0 9px;background:none;border:0;cursor:pointer;touch-action:manipulation}
.menubtn i{display:block;height:2px;border-radius:2px;background:var(--fg);transition:transform .2s,opacity .2s}
.menubtn[aria-expanded="true"] i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menubtn[aria-expanded="true"] i:nth-child(2){opacity:0}
.menubtn[aria-expanded="true"] i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.menu{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 14px 14px}
.menu .event{padding-block:14px 0}
.menu h1{font-size:28px}
.menu .watch{background:var(--panel2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:800 34px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--fg);line-height:1.1}
.chip b{font-weight:700}
.chip.live{border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.12)}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.watch{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.watch .tv{font:800 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.watch .times{font-size:13px;color:var(--muted);text-align:right}
.watch .times b{color:var(--fg);font-weight:600}

/* Sections */
section{margin-top:22px}
.h2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.h2 h2{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.h2 span{font-size:12px;color:var(--dim)}

/* The fight on now */
.now{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden}
.now .meta{display:flex;justify-content:space-between;gap:8px;padding:12px 14px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.face{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;padding:6px 10px 0}
.fighter{min-width:0;text-align:center}
.photo{position:relative;height:118px;display:flex;align-items:flex-end;justify-content:center}
.photo img{max-height:118px;max-width:100%;object-fit:contain;display:block}
.photo .ini{width:84px;height:84px;margin-bottom:12px;border-radius:50%;display:grid;place-items:center;font:800 30px/1 var(--display);background:var(--panel);border:2px solid var(--line)}
.fighter.r .ini{border-color:var(--red)} .fighter.b .ini{border-color:var(--blue)}
.fname{font:800 25px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;padding-top:8px;border-top:3px solid var(--red)}
.fighter.b .fname{border-top-color:var(--blue)}
.fsub{font-size:12.5px;color:var(--muted);margin-top:4px}
.fsub img{width:16px;height:11px;object-fit:cover;vertical-align:-1px;border-radius:2px;margin-right:4px}
.vs{font:700 15px/1 var(--display);color:var(--dim);padding-bottom:26px;letter-spacing:.1em}
.clockrow{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 14px 4px}
.round{font:700 15px/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.round b{display:block;font-size:30px;color:var(--fg);letter-spacing:.02em}
.clock{font:800 64px/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums;min-width:2.6ch;text-align:center}
.clock.small{font-size:30px;color:var(--muted)}
.phase{text-align:center;font-size:13.5px;color:var(--muted);padding:0 14px 12px}
.phase b{color:var(--fg)}
.banner{margin:0 14px 12px;padding:10px 12px;border-radius:12px;background:rgba(242,184,75,.12);border:1px solid rgba(242,184,75,.4);color:var(--gold);font-weight:600;text-align:center}
.stats{padding:6px 14px 14px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:4.2em 1fr 4.2em;align-items:center;gap:8px}
.srow .v{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.srow .v small{font:500 12px var(--body);color:var(--muted);margin-left:2px}
.srow .v.r{text-align:left} .srow .v.b{text-align:right}
.srow .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .r{background:var(--red)} .bar .b{background:var(--blue)}
.stats .src{font-size:11px;color:var(--dim);text-align:center}
.feed{border-top:1px solid var(--line);padding:10px 14px 12px;display:grid;gap:6px}
.feed div{display:grid;grid-template-columns:4.6em 1fr;gap:8px;font-size:13.5px}
.feed .t{color:var(--muted);font-variant-numeric:tabular-nums}
.feed .k{color:var(--gold);font-weight:700}
.feed .rc{color:var(--red);font-weight:600} .feed .bc{color:var(--blue);font-weight:600}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.countdown{font:800 44px/1 var(--display);color:var(--fg);font-variant-numeric:tabular-nums;margin:6px 0}

/* Up next */
.next{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.next .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.next .side{display:flex;align-items:center;gap:10px;min-width:0}
.next .side.b{flex-direction:row-reverse;text-align:right}
.next .side img,.next .side .mini{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel2);flex:none;border:2px solid var(--red)}
.next .side.b img,.next .side.b .mini{border-color:var(--blue)}
.next .mini{display:grid;place-items:center;font:800 17px/1 var(--display)}
.next .nm{font:800 20px/1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.next .rec{font-size:12.5px;color:var(--muted)}
.next .when{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* Results + card rows */
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer}
.row>button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.rtop{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.pill{border-radius:6px;padding:2px 7px;font-size:11px;letter-spacing:.06em;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live);color:#fff}
.pill.fin{background:transparent;border:1px solid var(--line)}
.fl{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;padding:1px 0}
.fl .c{width:10px;height:10px;border-radius:2px;background:var(--red)}
.fl.b .c{background:var(--blue)}
.fl .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .rc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fl .w{font:800 13px/1 var(--display);color:#14110a;background:var(--gold);border-radius:4px;padding:3px 5px;letter-spacing:.05em}
.fl.lost .n{color:var(--muted);font-weight:500}
.how{font-size:13px;color:var(--fg);margin-top:6px}
.how span{color:var(--muted)}
.res{padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.res .txt{display:grid;gap:3px;min-width:0}
.avs{position:relative;width:76px;height:52px;flex:none}
.avs .a{position:absolute;top:0;left:0;width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--panel2);border:2px solid var(--gold);z-index:2;display:grid;place-items:center;font:800 18px/1 var(--display);color:var(--fg)}
.avs .a.l{left:32px;top:6px;width:42px;height:42px;border-color:var(--line);filter:grayscale(1);opacity:.7;z-index:1;font-size:14px}
.avs .a.n{border-color:var(--line)}
.res .w1{font-weight:600}
.res .w1 b{font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.res .m{font-size:13px;color:var(--muted)}
.tape{padding:2px 14px 14px;display:grid;gap:0}
.tape table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tape td{padding:6px 0;border-top:1px solid var(--line)}
.tape td:first-child{text-align:left;color:var(--fg);width:36%}
.tape td:last-child{text-align:right;width:36%}
.tape td.l{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.tape .th td{border-top:0;font:800 16px/1.1 var(--display);text-transform:uppercase}
.tape .th td:first-child{color:var(--red)} .tape .th td:last-child{color:var(--blue)}
.tape .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 0 2px;text-align:center}
.tape a{color:var(--muted);font-size:12.5px}
.seghead{padding:10px 14px;background:var(--panel2);display:flex;justify-content:space-between;font:700 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seghead span{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:500;font-size:12.5px}
.sync{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.synchead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.synchint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.syncshow{font:700 44px/1 var(--display);text-align:center;margin:12px 0 10px;letter-spacing:.04em}
.pad,.nudge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nudge{margin-top:8px}
.key{font:600 22px/1 var(--body);padding:13px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;touch-action:manipulation}
.key:active{filter:brightness(1.35)}
.key.alt{font-size:15px;color:var(--muted)}
.key.ok{background:var(--red);border-color:var(--red);color:#fff}
.note{margin-top:10px;font-size:13px;color:var(--gold);line-height:1.4}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(242,184,75,.4);background:rgba(242,184,75,.08);color:var(--gold);font-size:13.5px}
#tvSec{scroll-margin-top:72px}
.tvbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.player{background:#000}
.player video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tvpad{padding:12px 14px 14px}
.tvpad label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.tvpad input{width:100%;font:16px/1.3 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.tvpad input:focus{border-color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--red);color:#fff;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.5}
.tvstat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.tvstat b{color:var(--fg);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer}
.chans{margin-top:8px}
.chan{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer;touch-action:manipulation}
.chan span{font-weight:600}
.chan small{color:var(--dim);font-size:11.5px;text-align:right}
.chan.on span{color:var(--gold)}
.tvnote{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.45}
footer{margin-top:26px;font-size:12px;color:var(--dim);line-height:1.6}
.skeleton{height:220px;border-radius:18px;background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (min-width:420px){h1{font-size:40px}.fname{font-size:28px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Cageside</div>
    <button class="fresh" id="fresh" type="button" title="Refresh now"><span class="dot"></span><span id="freshText">Loading</span></button>
    <button class="menubtn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
  </div>
</header>

<main class="wrap">
  <div id="menu" class="menu" hidden>
    <div id="event" class="event"><div class="eyebrow">UFC</div><h1>Loading the card…</h1></div>
    <div class="btns"><button type="button" class="btn ghost" id="menuDone">Done</button></div>
  </div>
  <div id="err"></div>
  <section id="tvSec" hidden>
    <div class="h2"><h2>Watch</h2><span>Your IPTV, on this phone</span></div>
    <div class="tvbox">
      <div class="player" id="tvPlayer" hidden><video id="tvVid" playsinline controls preload="none"></video></div>
      <div class="tvpad" id="tvPanel"></div>
    </div>
  </section>
  <section id="nowSec"><div class="h2"><h2>On now</h2></div><div class="skeleton"></div></section>
  <section id="nextSec" hidden></section>
  <section id="resSec" hidden></section>
  <section id="cardSec" hidden></section>
  <footer id="foot">Live data from ESPN and UFC.com. Times are UK time. Tap any fight for the tale of the tape.</footer>
</main>

<script>
'use strict';
const ESPN_SB = 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard';
const ESPN_FC = id => `https://site.web.api.espn.com/apis/common/v3/sports/mma/ufc/fightcenter/${id}?region=gb&lang=en`;
const UFC = 'https://d29dxerjsp82wz.cloudfront.net/api/v3';
const TZ = 'Europe/London';
/* UFC.com's own number for ESPN cards already known (ESPN event id -> UFC.com event id). */
const UFC_SEED = { '600061665': 1348 };
const UFC_KNOWN = 1348;
const ROUND_MS = 300000;
/* Push alerts: the sender's public key, and the mailbox the phone leaves its subscription in. */
const VAPID_PUBLIC = 'BO5CqyagCNZSaw_W55Fn2EsqMWnLWONFTK1apDc0RQCOgf9x_gxXBP_uOx3Jw0z30tV331KUKcvB00nXtFGLRh0';
const SUB_TOPIC = 'cageside-subs-q8m3vz';
const MAX_DELAY = 600; // seconds the phone can be held back to match a TV stream

const S = {
  sb: null, sbAt: 0,
  fc: [],            // fight-centre snapshots [{at, data}]
  ufc: [],           // UFC.com card snapshots [{at, data}]
  ust: {},           // UFC.com fight stats by fight id: [{at, data}]
  ufcId: null, scanAt: 0, ufcFails: 0,
  open: new Set(), errors: {}, lastOk: 0,
  delay: 0, wake: null, wakeOn: false,
  sync: { open: false, digits: '', msg: '' }, syncNote: null,
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const lastWord = s => { const w = norm(s).split(' '); return w[w.length - 1] || ''; };
const same = (a, b) => { const x = lastWord(a), y = lastWord(b); return !!x && x === y; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
const timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
const dayFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });

const FEED = {

/* Sizes the British way: height in feet and inches, reach in inches, weight in stone and pounds. */

  if (nick(ur) || nick(ub)) h += row(nick(ur) || '–', 'Nickname', nick(ub) || '–');

    h += row(v(cr.strikeLPM), 'Sig. strikes / min', v(cb.strikeLPM));
    h += row(cr.strikeAccuracy ? `${Math.round(+cr.strikeAccuracy)}%` : '–', 'Strike accuracy', cb.strikeAccuracy ? `${Math.round(+cb.strikeAccuracy)}%` : '–');
    h += row(v(cr.takedownAvg), 'Takedowns / 15 min', v(cb.takedownAvg));
    h += row(cr.takedownAccuracy ? `${Math.round(+cr.takedownAccuracy)}%` : '–', 'Takedown accuracy', cb.takedownAccuracy ? `${Math.round(+cb.takedownAccuracy)}%` : '–');

let lastHTML = {};
function put(id, html) {
  const el = document.getElementById(id);
  // The ticking clock and countdowns update themselves; don't rebuild (and re-load photos) for them.
  const key = html.replace(/(data-(?:clock|until)="[^"]*">)[^<]*/g, '$1');
  if (lastHTML[id] === key) return;
  lastHTML[id] = key;
  const t = document.createElement('template');

/* Make `from` look like `to` by changing only what differs, so photos don't reload and nothing flashes. */

    for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
    for (const a of [...to.attributes]) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  }
  const a = [...from.childNodes], b = [...to.childNodes];
  b.forEach((y, i) => {
    const x = a[i];

function render() {

    return;
  }
  put('err', '');
  put('event', renderEvent(m));

function renderFresh() {
  const el = $('#fresh'), tx = $('#freshText');
  const at = Math.max(S.fc.length ? S.fc[S.fc.length - 1].at : 0, S.ufc.length ? S.ufc[S.ufc.length - 1].at : 0);
  if (!at) { tx.textContent = S.errors.fc ? 'Offline' : 'Loading'; el.className = 'fresh' + (S.errors.fc ? ' warn' : ''); return; }
  // Each feed is checked as often as it changes (ESPN every 30 s, UFC.com every few seconds), so the page
  // is live while the last check of the feeds in use is on time.
  const lastFc = S.fc.length ? S.fc[S.fc.length - 1].at : 0;
  const lastU = S.ufc.length && S.ufcFails === 0 ? S.ufc[S.ufc.length - 1].at : 0;
  const late = Math.max(now() - lastFc - 36000, lastU ? now() - lastU - 12000 : -1);
  const age = Math.round((now() - at) / 1000);
  tx.textContent = late <= 0 ? 'Live' : age < 90 ? `Updated ${age}s ago` : `Updated ${Math.round(age / 60)}m ago`;

}

/* Second-by-second: the round clock and countdowns only. */
function tick() {
  const m = model();
  if (m && m.live) {
    const left = clockLeft(m.live, viewNow());
    document.querySelectorAll('[data-clock]').forEach(el => { if (left >= 0) el.textContent = mmss(left); });
    if (left === 0) render();
  }
  document.querySelectorAll('[data-until]').forEach(el => { el.textContent = untilText(+el.dataset.until); });
  renderFresh();
  if (S.syncNote && S.syncNote.until < now()) { S.syncNote = null; render(); }
  if (S.delay) render();
}

/* ---------- Loading ---------- */
async function loadSb() {
  try { S.sb = await getJSON(ESPN_SB); S.sbAt = now(); S.errors.sb = null; }
  catch (e) { S.errors.sb = e.message || 'error'; }
}
function eventId() {
  const q = new URLSearchParams(location.search).get('espn');
  if (q) return q;
  const evs = (S.sb && S.sb.events) || [];
  return evs[0] && evs[0].id;
}
async function loadFc() {
  const id = eventId();
  if (!id) return;
  const info = {};
  try {
    const d = parseCenter(await getJSON(ESPN_FC(id), 8000, info));
    // ESPN makes a new copy every 30 s and says how long this one has left (max-age): the copy (and its
    // round clock) dates from the start of that window, and the next one is out when it runs down.
    const left = info.maxAge != null && info.maxAge <= 30 ? info.maxAge : null;
    d.genAt = left != null ? now() - (30 - left) * 1000 : now();
    d.fights.forEach(f => { f.clockAt = d.genAt; });
    push(S.fc, d); S.errors.fc = null; S.lastOk = now();
    S.fcNext = left != null ? now() + (left + 1) * 1000 : 0;
  } catch (e) { S.errors.fc = e.message || 'error'; S.fcNext = now() + 3000; }
}
function ufcMatchesEvent(u, fc) {
  if (!u || !fc) return false;
  const ev = fc.event || {};
  if (norm(u.name) === norm(ev.name)) return true;
  const start = Date.parse(ev.date);
  if (u.start && start && Math.abs(u.start - start) > 36 * 3600e3) return false;
  const me = fc.fights.find(f => f.main) || fc.fights[0];
  return !!me && [me.red.last, me.blue.last].every(n => u.fights.some(f => same(f.red.Name && f.red.Name.LastName, n) || same(f.blue.Name && f.blue.Name.LastName, n)));
}
async function findUfc() {
  const fcS = S.fc[S.fc.length - 1];
  if (!fcS) return;
  const id = String(fcS.data.event.id || eventId() || '');
  const q = new URLSearchParams(location.search).get('ufc');
  if (q) { S.ufcId = +q; return; }
  const cached = lsGet('ufc:' + id) || UFC_SEED[id];
  if (cached) { S.ufcId = +cached; return; }
  if (S.scanAt && now() - S.scanAt < 10 * 60e3) return;
  S.scanAt = now();
  const base = +(lsGet('ufc:last') || UFC_KNOWN);
  const ids = [];
  for (let d = 0; d <= 22; d++) { ids.push(base + d); if (d && d <= 8) ids.push(base - d); }
  for (let i = 0; i < ids.length; i += 6) {
    const got = await Promise.all(ids.slice(i, i + 6).map(n => getJSON(`${UFC}/event/live/${n}.json`, 6000).then(parseUfc).catch(() => null)));
    const hit = got.find(u => ufcMatchesEvent(u, fcS.data));
    if (hit) { S.ufcId = hit.id; lsSet('ufc:' + id, hit.id); lsSet('ufc:last', hit.id); push(S.ufc, hit); return; }
  }
}
async function loadUfc() {
  if (!S.ufcId) { await findUfc(); if (!S.ufcId) return; }
  try {
    const u = parseUfc(await getJSON(`${UFC}/event/live/${S.ufcId}.json`, 6000));
    if (u) { push(S.ufc, u); S.ufcFails = 0; }
  } catch (e) { S.ufcFails++; }
}
async function loadStats() {
  const m = model();
  if (!m || !m.live || !m.live.u) return;
  const u = m.live.u;
  if (!u.round) return;
  try {
    const st = parseUfcStats(await getJSON(`${UFC}/fight/live/${u.id}.json`, 6000), u);
    if (st) { S.ust[u.id] = S.ust[u.id] || []; push(S.ust[u.id], st); }
  } catch (e) { /* ESPN's stats stand in */ }
}

function liveish() {
  const s = S.fc[S.fc.length - 1];
  if (!s) return false;
  const fs = s.data.fights;
  if (!fs.length) return false;
  if (fs.some(f => f.state === 'in')) return true;
  const first = Math.min(...fs.map(f => f.start));
  const pending = fs.some(f => f.state !== 'post');
  return pending && now() > first - 20 * 60e3 && now() < first + 12 * 3600e3;

const due = { sb: 0, fc: 0, ufc: 0, st: 0 };
const busy = {};
async function run(key, fn) {
  if (busy[key]) return;
  busy[key] = true;
  try { await fn(); } finally { busy[key] = false; render(); }
}
function schedule(force) {
  if (document.hidden && !force) return;
  const t = now(), live = liveish();
  const iv = { sb: live ? 300e3 : 900e3, fc: live ? 31e3 : 120e3, ufc: live ? 3e3 : 0, st: live ? 6e3 : 0 };
  if (force || t >= due.sb) { due.sb = t + iv.sb; run('sb', async () => { await loadSb(); await loadFc(); due.fc = S.fcNext ? Math.max(now() + 2000, S.fcNext) : now() + iv.fc; }); return; }
  if (t >= due.fc) {
    due.fc = t + iv.fc;
    run('fc', async () => { await loadFc(); if (S.fcNext) due.fc = Math.max(now() + 2000, Math.min(due.fc, S.fcNext)); });
  }
  if (iv.ufc && t >= due.ufc) { due.ufc = t + (S.ufcFails > 3 ? 15e3 : iv.ufc); run('ufc', loadUfc); }
  if (iv.st && t >= due.st) { due.st = t + iv.st; run('st', loadStats); }
}

/* ---------- Controls ---------- */
document.addEventListener('click', async e => {

function toggleMenu(open = $('#menu').hidden) {

/* ---------- Alerts (Web Push to the Home Screen app) ---------- */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const standalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function sendSub(sub) {
  const r = await fetch('https://ntfy.sh/' + SUB_TOPIC, { method: 'POST', body: JSON.stringify({ sub: sub.toJSON() }) });
  if (!r.ok) throw new Error('mailbox answered ' + r.status);

}
async function turnOnAlerts() {
  if (!pushSupported()) {
    S.alertMsg = standalone()
      ? 'This Home Screen copy can\'t get alerts. Open is.gd/cagesideufc in Safari, tap Share, then Add to Home Screen, and use the new icon.'
      : 'Alerts work when Cageside is opened from its Home Screen icon. In Safari tap Share, then Add to Home Screen, and open it from there.';
    render(); return;
  }
  // Ask first, straight from the tap: iPhone only shows the prompt for a direct tap.
  const perm = await (Notification.permission === 'default' ? Notification.requestPermission() : Promise.resolve(Notification.permission));
  if (perm !== 'granted') {

    S.alertMsg = 'Alerts on. A test alert should arrive within a minute.';
  } catch (x) {
    S.alertMsg = 'Couldn\'t turn alerts on (' + (x && x.message || x) + '). Try again in a moment.';
  }

}
/* Off: drop this phone's subscription. The sender's next alert to it is refused, and it forgets the phone. */

    if (sub) await sub.unsubscribe();

    S.alertMsg = 'Alerts off. Tap the chip again to turn them back on.';
  } catch (x) {
    S.alertMsg = 'Couldn\'t turn alerts off (' + (x && x.message || x) + '). Try again, or turn off Cageside in Settings > Notifications.';
  }
  render();
}
async function bootAlerts() {
  if (!pushSupported()) return;
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    if (Notification.permission !== 'granted') return;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { S.alerts = 'off'; render(); return; }
    S.alerts = 'on'; render();
    // Leave the subscription in the mailbox again now and then, so a restarted sender still has it.
    if (now() - (+lsGet('subPostedAt') || 0) > 6 * 3600e3) await sendSub(sub);
  } catch (x) { /* alerts stay as they were */ }
}

/* ---------- Sync with the TV: type the round clock the TV shows, and the delay is worked out ---------- */
const clampDelay = d => Math.max(0, Math.min(MAX_DELAY, Math.round(+d || 0)));
function setDelay(d, note) {
  S.delay = clampDelay(d); lsSet('delay', S.delay);
  if (note) S.syncNote = { text: note, until: now() + 8000 };
  render();
}
function syncPanel() {
  const d = S.sync.digits.padStart(3, '0');
  const shown = S.sync.digits ? `${+d.slice(0, -2)}:${d.slice(-2)}` : '–:––';
  const key = (k, label, cls = '') => `<button type="button" class="key${cls}" data-pad="${k}">${label}</button>`;
  return `<div class="sync">
    <div class="synchead"><b>Sync with your TV</b><button type="button" class="linkbtn" data-pad="close">Close</button></div>
    <div class="synchint">Type the round clock your TV is showing, then tap OK. For a perfect match, type a time just coming up (a few seconds lower) and tap OK as the TV clock hits it.</div>
    <div class="syncshow num">${shown}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => key(n, n)).join('')}${key('del', '⌫', ' alt')}${key(0, 0)}${key('ok', 'OK', ' ok')}</div>
    <div class="nudge">${key('minus', '−5s', ' alt')}${key('off', 'Off', ' alt')}${key('plus', '+5s', ' alt')}</div>
    <div class="synchint">Now ${S.delay ? `${S.delay}s behind live` : 'live, no delay'}.</div>
    ${S.sync.msg ? `<div class="note">${esc(S.sync.msg)}</div>` : ''}
  </div>`;
}
function padKey(k) {
  const sy = S.sync;
  sy.msg = '';
  if (/^\d$/.test(k)) { if (sy.digits.length < 3) sy.digits = (sy.digits + k).replace(/^0+(?=\d)/, ''); }
  else if (k === 'del') sy.digits = sy.digits.slice(0, -1);
  else if (k === 'close') sy.open = false;
  else if (k === 'off') setDelay(0, 'TV delay off: showing live.');
  else if (k === 'minus' || k === 'plus') setDelay(S.delay + (k === 'plus' ? 5 : -5));
  else if (k === 'ok') {
    const d = sy.digits.padStart(3, '0'), mins = +d.slice(0, -2), secs = +d.slice(-2);
    if (!sy.digits) sy.msg = 'Type the time on the TV clock first.';
    else if (secs > 59 || mins * 60 + secs > 300) sy.msg = 'Rounds are 5 minutes, so that time can\'t be on the clock.';
    else {
      const r = syncToTv(mins * 60 + secs);
      if (typeof r === 'string') sy.msg = r;
      else { sy.open = false; sy.digits = ''; setDelay(r, r ? `Synced with your TV: ${r}s behind live.` : 'Your TV is level with live, so there\'s no delay.'); return; }
    }
  }
  render();
}
/* The delay that makes the round clock read `left` (seconds) right now, from the newest UFC.com data. */
function syncToTv(left) {
  const at = now();
  const last = S.ufc.length ? S.ufc[S.ufc.length - 1] : null;
  if (!last || at - last.at > 120000) {
    // UFC.com's feed is down: use ESPN's round clock (good to a few seconds). A TV still in the
    // previous round is a round plus the minute's break further back.
    const fc = S.fc.length ? S.fc[S.fc.length - 1].data : null;
    const f = fc && fc.fights.find(x => x.state === 'in');
    const live = espnLeft(f, at);
    if (live < 0) return 'Can\'t sync right now: the live round clock isn\'t coming through. Use −5s and +5s instead.';
    let d = left - live;
    if (d < -30) d += 360;
    return d > MAX_DELAY ? `That puts your TV over ${MAX_DELAY / 60} minutes behind. Check the time and try again.` : Math.max(0, d);
  }
  let best = null;
  for (const f of last.data.fights || []) {
    const rounds = [];
    for (const t of f.log || []) {
      const ts = ufcTime(t.Timestamp), ty = t.Type || '';
      if (ty === 'round_start') rounds.push({ at: ts, pauses: [] });
      else if (rounds.length && ty === 'round_pause') rounds[rounds.length - 1].pauses.push([ts, 0]);
      else if (rounds.length && ty === 'round_unpause') { const p = rounds[rounds.length - 1].pauses; if (p.length && !p[p.length - 1][1]) p[p.length - 1][1] = ts; }
    }
    if (rounds.length && (!best || rounds[rounds.length - 1].at > best[best.length - 1].at)) best = rounds;
  }
  if (!best || at - best[best.length - 1].at > 45 * 60000) return 'There\'s no round on right now. Sync while a round is on, when the TV shows the clock.';
  // Newest round first: the TV is either in the same round as live, or still in an earlier one.
  for (let i = best.length - 1; i >= 0; i--) {
    let pos = best[i].at + (300 - left) * 1000;
    for (const [a, b] of best[i].pauses) if (a < pos) pos += (b || at) - a;
    const d = Math.round((at - pos) / 1000);
    // A few seconds 'ahead' is the feed's own lag or a slow tap: that means level with live.
    if (d >= -30) return d > MAX_DELAY ? `That puts your TV over ${MAX_DELAY / 60} minutes behind. Check the time and try again.` : Math.max(0, d);
  }
  return 'Your TV looks ahead of the live data. Check the time and try again.';
}

/* ---------- Watch: the user's own IPTV login (Xtream Codes) ----------
   Nothing about the login is in this page. The user types it in; it is kept only in this Home Screen
   app's own storage on the phone (never in a Safari tab, where other pages on this site could read it),
   and it is only ever sent to the provider's own server, over HTTPS. */
const TV_KEY = 'tvLogin';
const TV = { open: false, state: 'login', msg: '', login: null, base: '', info: null, hls: true, chans: [], all: false, q: 'TNT Sport', playing: null, playMsg: '', slow: 0 };

function tvSaved() {
  try { const j = JSON.parse(lsGet(TV_KEY) || 'null'); return j && j.server && j.user && j.pass ? j : null; } catch (e) { return null; }
}
/* Just the host (and port) from whatever was typed: no scheme, path, spaces or stray dots and slashes. */
function tvHost(server) {
  let t = String(server || '').replace(/\s+/g, '').replace(/^[a-z][a-z0-9+.-]*:\/+/i, '').replace(/^[./\\]+/, '');
  t = t.split(/[/?#\\]/)[0].replace(/\.+$/, '').replace(/\.{2,}/g, '.').replace(/\.:/, ':').toLowerCase();
  return t;
}
/* Providers that moved to a new address, which a web page can't follow on its own. Each entry is
   found by a hash of the old address and the new one is sealed with it, so the page itself names no provider. */
const TV_MOVES = { '98e258b6d98146054a42007b30f37a21': 'a30ezic1n/rzgC4CV7K6e4iwzbu5tr+wc7WPYqzSgUNbAlIeTZevvuPZ' };
async function tvMoved(host) {
  try {
    const sha = async t => new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)));
    const id = [...(await sha('cageside-move|' + host))].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
    const sealed = TV_MOVES[id];
    if (!sealed) return host;
    const raw = Uint8Array.from(atob(sealed), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', await sha('cageside-key|' + host), 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12)));
  } catch (e) { return host; }
}
/* HTTPS addresses to try for the host (a page on HTTPS can't use a plain-HTTP server). */
function tvCandidates(host) {
  let u; try { u = new URL('http://' + host); } catch (e) { return []; }
  const out = [], add = x => { if (!out.includes(x)) out.push(x); };
  add('https://' + u.host);
  add('https://' + u.hostname);
  if (location.protocol === 'http:') add('http://' + u.host); // local testing only
  return out;
}
async function tvFetch(url, ms = 15000) {
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(timer); }
}
const tvApi = (action, extra = '', base = TV.base, l = TV.login) =>
  `${base}/player_api.php?username=${encodeURIComponent(l.user)}&password=${encodeURIComponent(l.pass)}${action ? '&action=' + action : ''}${extra}`;
const tvUrl = (id, ext) => `${TV.base}/live/${encodeURIComponent(TV.login.user)}/${encodeURIComponent(TV.login.pass)}/${id}.${ext || (TV.hls ? 'm3u8' : 'ts')}`;

async function tvConnect(login) {
  TV.tried = login; TV.state = 'busy'; TV.msg = 'Signing in to your provider…'; renderTv();
  const typed = tvHost(login.server), host = await tvMoved(typed);
  login = { ...login, server: host };
  let last = null;
  for (const base of tvCandidates(host)) {
    try {
      const j = await tvFetch(tvApi('', '', base, login));
      const ui = j && j.user_info;
      if (!ui) throw new Error('not an IPTV server');
      TV.state = 'login';
      if (String(ui.auth) !== '1') { TV.msg = 'Your provider didn\'t accept that username and password.'; renderTv(); return; }
      if (ui.status && ui.status !== 'Active') { TV.msg = `Your provider says this account is ${ui.status}.`; renderTv(); return; }
      const fmts = Array.isArray(ui.allowed_output_formats) ? ui.allowed_output_formats : [];
      TV.hls = !fmts.length || fmts.includes('m3u8');
      TV.base = base; TV.login = login; TV.info = ui;
      if (standalone()) lsSet(TV_KEY, JSON.stringify(login));
      await tvLoadChannels(false);
      return;
    } catch (e) { last = e; }
  }
  TV.state = 'login';
  TV.msg = last && last.status
    ? `Your provider turned that down (it answered ${last.status}). Check the username and password.`
    : `Couldn't reach ${host || 'that server'} from a web page. Check the server address. If your provider has moved to a new address, type the new one (a web page can't follow the move).`;
  renderTv();
}

async function tvLoadChannels(all) {
  TV.state = 'busy'; TV.msg = all ? 'Loading every channel. This can take a moment…' : 'Finding the sports channels…'; renderTv();
  try {
    const cats = await tvFetch(tvApi('get_live_categories'));
    const catName = {};
    (Array.isArray(cats) ? cats : []).forEach(c => { catName[c.category_id] = String(c.category_name || ''); });
    let streams = [];
    if (all) streams = await tvFetch(tvApi('get_live_streams'), 90000);
    else {
      const pick = (Array.isArray(cats) ? cats : []).filter(c => /sport|tnt|ufc|ppv|fight|mma|box/i.test(c.category_name || '')).slice(0, 30);
      if (!pick.length) return tvLoadChannels(true);
      for (let i = 0; i < pick.length; i += 5) {
        const part = await Promise.all(pick.slice(i, i + 5).map(c => tvFetch(tvApi('get_live_streams', '&category_id=' + encodeURIComponent(c.category_id))).catch(() => [])));
        part.forEach(a => { if (Array.isArray(a)) streams.push(...a); });
      }
    }
    const seen = new Set();
    TV.chans = (Array.isArray(streams) ? streams : []).filter(x => x && x.stream_id != null && !seen.has(String(x.stream_id)) && seen.add(String(x.stream_id)))
      .map(x => ({ id: String(x.stream_id), name: String(x.name || '').trim(), cat: catName[x.category_id] || '' }));
    TV.all = !!all; TV.msg = TV.chans.length ? '' : 'Your provider sent no channels for this.';
  } catch (e) {
    TV.msg = `Couldn't load the channel list (${e.status ? 'HTTP ' + e.status : 'no answer'}). Tap Watch again to retry.`;
  }
  TV.state = 'list'; renderTv();
}

function tvMatches() {
  const words = TV.q.toLowerCase().split(/\s+/).filter(Boolean);
  const uk = c => /\b(uk|gb)\b|united kingdom/i.test(c.name + ' ' + c.cat) ? 0 : 1;
  return TV.chans.filter(c => { const h = (c.name + ' ' + c.cat).toLowerCase(); return words.every(w => h.includes(w)); })
    .sort((a, b) => uk(a) - uk(b) || a.name.localeCompare(b.name, 'en', { numeric: true })).slice(0, 60);
}

function renderTv() {
  $('#tvSec').hidden = !TV.open;
  if (!TV.open) return;
  const p = $('#tvPanel');
  const msg = TV.msg ? `<div class="note">${esc(TV.msg)}</div>` : '';
  if (TV.state === 'busy') { p.innerHTML = `<div class="tvstat"><span>${esc(TV.msg)}</span></div>`; return; }
  if (TV.state === 'login') {
    const s = TV.tried || tvSaved() || {};
    p.innerHTML = `<form id="tvForm" autocomplete="on">
      <label for="tvServer">Server</label><input id="tvServer" name="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your provider's address" value="${esc(s.server || '')}">
      <label for="tvUser">Username</label><input id="tvUser" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.user || '')}">
      <label for="tvPass">Password</label><input id="tvPass" name="password" type="password" autocomplete="current-password" value="${esc(s.pass || '')}">
      <div class="btns"><button class="btn" type="submit">Sign in</button></div>
    </form>${msg}
    <div class="tvnote">The same IPTV login as LUMEN. ${standalone()
      ? 'It stays on this iPhone, in Cageside\'s own storage, and only ever goes to your provider.'
      : 'In a browser tab it isn\'t saved. Open Cageside from your Home Screen to have this iPhone remember it.'}</div>`;
    return;
  }
  p.innerHTML = `<div id="tvStatus"></div>
    <label for="tvQ">Channels</label><input id="tvQ" type="search" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(TV.q)}" placeholder="Search channels">
    ${msg}<div class="chans" id="tvList"></div>
    <div class="btns">${TV.all ? '' : '<button class="btn ghost" type="button" id="tvAll">Search every channel</button>'}</div>`;
  renderTvStatus(); renderTvList();
}
function renderTvStatus() {
  const el = $('#tvStatus'); if (!el) return;
  if (TV.playing) {
    const vlc = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(tvUrl(TV.playing.id));
    el.innerHTML = `<div class="tvstat"><span>Playing <b>${esc(TV.playing.name)}</b></span></div>
      ${TV.playMsg ? `<div class="note">${esc(TV.playMsg)}</div>` : ''}
      <div class="btns"><button class="btn" type="button" id="tvStop">Stop</button><a class="btn ghost" href="${esc(vlc)}">Open in VLC</a></div>`;
    return;
  }
  const ui = TV.info || {};
  const cons = ui.max_connections ? ` · ${esc(ui.active_cons ?? '?')} of ${esc(ui.max_connections)} streams in use` : '';
  el.innerHTML = `<div class="tvstat"><span>Signed in${cons}</span><button class="linkbtn" type="button" id="tvForget">Forget login</button></div>
    ${TV.hls ? '' : '<div class="note">Your account doesn\'t offer the stream type the iPhone plays in a page, so channels open in VLC instead.</div>'}`;
}
function renderTvList() {
  const el = $('#tvList'); if (!el) return;
  const list = tvMatches();
  el.innerHTML = list.length
    ? list.map(c => TV.hls
        ? `<button type="button" class="chan${TV.playing && TV.playing.id === c.id ? ' on' : ''}" data-ch="${esc(c.id)}"><span>${esc(c.name)}</span><small>${esc(c.cat)}</small></button>`
        : `<a class="chan" href="${esc('vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(tvUrl(c.id, 'ts')))}"><span>${esc(c.name)}</span><small>${esc(c.cat)}</small></a>`).join('')
    : `<div class="tvnote">${TV.chans.length ? 'No channel matches that.' + (TV.all ? '' : ' Try Search every channel.') : ''}</div>`;
}

function tvToggle() {
  TV.open = !TV.open;
  if (!TV.open) tvStop();
  else if (!TV.login || TV.state !== 'list') { const s = tvSaved(); if (s) tvConnect(s); else { TV.state = 'login'; TV.msg = ''; } }
  if (TV.open) toggleMenu(false);
  render(); renderTv();
  if (TV.open) $('#tvSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function tvPlay(id) {
  const c = TV.chans.find(x => x.id === id), v = $('#tvVid');
  if (!c || !v) return;
  TV.playing = c; TV.playMsg = `Starting ${c.name}…`;
  $('#tvPlayer').hidden = false;
  v.src = tvUrl(id);
  const pr = v.play(); if (pr) pr.catch(() => {});
  clearTimeout(TV.slow);
  TV.slow = setTimeout(() => {
    if (TV.playing === c && (v.paused || v.readyState < 3)) { TV.playMsg = 'Still not playing. Try another channel, or Open in VLC.'; renderTvStatus(); }
  }, 20000);
  renderTvStatus(); renderTvList();
  $('#tvSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function tvStop() {
  const v = $('#tvVid');
  clearTimeout(TV.slow);
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  TV.playing = null; TV.playMsg = '';
  $('#tvPlayer').hidden = true;
  renderTvStatus(); renderTvList();
}
function tvForget() {
  tvStop();
  try { localStorage.removeItem(TV_KEY); } catch (e) {}
  Object.assign(TV, { state: 'login', msg: 'Login forgotten on this phone.', login: null, tried: null, base: '', info: null, chans: [], all: false });
  renderTv();
}
(function () {
  const v = $('#tvVid');
  v.addEventListener('playing', () => { if (TV.playing) { TV.playMsg = ''; renderTvStatus(); } });
  v.addEventListener('error', () => {
    if (!TV.playing || !v.getAttribute('src')) return;
    TV.playMsg = `That channel wouldn't play here (error ${v.error ? v.error.code : '?'}). Try another, or Open in VLC.`;
    renderTvStatus();
  });
})();
document.addEventListener('submit', e => {
  if (e.target.id !== 'tvForm') return;
  e.preventDefault();
  const login = { server: $('#tvServer').value.trim(), user: $('#tvUser').value.trim(), pass: $('#tvPass').value };
  if (!login.server || !login.user || !login.pass) { TV.msg = 'Fill in the server, username and password.'; renderTv(); return; }
  if (document.activeElement) document.activeElement.blur();
  tvConnect(login);
});
document.addEventListener('input', e => { if (e.target.id === 'tvQ') { TV.q = e.target.value; renderTvList(); } });

S.alerts = 'off'; S.alertMsg = '';
bootAlerts();
S.delay = clampDelay(+lsGet('delay'));
schedule(true);
setInterval(schedule, 1000);
setInterval(tick, 1000);

// iPhone ignores user-scalable=no, so stop pinch zoom here (WebKit gesture events and two-finger moves). touch-action in the CSS stops double-tap zoom.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
