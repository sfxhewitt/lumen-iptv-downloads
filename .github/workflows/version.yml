name: Update version.json

# LUMEN reads version.json (beside LUMEN.apk) to offer updates inside the app, and LUMEN Home reads
# home-version.json (beside LUMEN-Home.apk) the same way. This keeps both matching their APKs:
# whenever an APK or the README changes on main, it reads each APK's own version, size and SHA-256
# and writes its version file, pointing at this exact commit's copy of the APK so the file and its
# hash can never disagree. LUMEN's "What's new" headlines come from the README's Latest section,
# only when that section is about this version.
on:
  push:
    branches: [main]
    paths: [LUMEN.apk, LUMEN-Home.apk, README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-json
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the version files
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          # APK, its version file, the package it must be.
          for spec in "LUMEN.apk version.json com.portallive.tv" "LUMEN-Home.apk home-version.json com.portallive.home"; do
            set -- $spec
            [ -f "$1" ] || { echo "No $1"; continue; }
            BADGING="$("$AAPT2" dump badging "$1" | sed -n 1p)"  # sed reads it all: head could stop aapt2 with SIGPIPE
            echo "$BADGING"
            PACKAGE="$(echo "$BADGING" | grep -o "^package: name='[^']*'" | cut -d"'" -f2)"
            [ "$PACKAGE" = "$3" ] || { echo "::error::$1 is $PACKAGE, not $3"; exit 1; }
            export APK="$1" OUT="$2"
            export CODE="$(echo "$BADGING" | grep -o " versionCode='[^']*'" | cut -d"'" -f2)"
            export NAME="$(echo "$BADGING" | grep -o " versionName='[^']*'" | cut -d"'" -f2)"
            export URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$1"
            python3 - <<'PY'
          import hashlib, json, os, re
          apk = open(os.environ["APK"], "rb").read()
          name = os.environ["NAME"]
          notes = []
          if os.environ["APK"] == "LUMEN.apk":
              readme = open("README.md", encoding="utf-8").read()
              latest = re.search(r"^## Latest: LUMEN (\S+)", readme, re.M)
              if latest and latest.group(1) == name:
                  section = re.search(r"^### What's new[^\n]*\n(.*?)(?=^#|\Z)", readme, re.M | re.S)
                  if section:
                      notes = re.findall(r"^- \*\*(.+?)\.?\*\*", section.group(1), re.M)[:6]
          manifest = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": name,
              "url": os.environ["URL"],
              "size": len(apk),
              "sha256": hashlib.sha256(apk).hexdigest(),
              "notes": notes,
          }
          with open(os.environ["OUT"], "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(os.environ["OUT"], json.dumps(manifest, indent=2))
          PY
          done

      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json home-version.json 2>/dev/null || git add version.json
          if git diff --cached --quiet; then echo "Version files already up to date"; exit 0; fi
          git commit -m "Version files: $(git diff --cached --name-only | while read f; do printf '%s %s ' "$f" "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionName"])' "$f")"; done)"
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
